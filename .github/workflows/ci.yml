name: Gazi SFT Backend CI/CD

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'sft_ingestion/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sft_ingestion/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

env:
  PYTHON_VERSION: "3.10"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/sft_test_db
  PGPORT: "5433"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Linting & Static Analysis
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sft_ingestion/requirements.txt

      - name: Install Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: |
          cd sft_ingestion
          ruff check . --output-format=github

      - name: Run Ruff Formatter Check
        run: |
          cd sft_ingestion
          ruff format --check .

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Unit + Integration + E2E Tests (PostgreSQL)
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
      fail-fast: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sft_test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sft_ingestion/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sft_ingestion/requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov anyio

      - name: Create .env File for Tests
        run: |
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > sft_ingestion/.env

      - name: Initialize PostgreSQL Schema
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d sft_test_db \
            -v ON_ERROR_STOP=1 \
            -f sft_ingestion/sql/init_schema.sql
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed Test Data
        run: |
          cd sft_ingestion
          python tests/seed_ci_data.py
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Unit Tests (Clinical Logic)
        run: |
          cd sft_ingestion
          python -m pytest tests/test_clinical_logic.py -v \
            --tb=short -m "not integration and not e2e" \
            --cov=. --cov-report=term-missing --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Parser & Idempotency Tests
        run: |
          cd sft_ingestion
          python -m pytest tests/test_parser_idempotency.py -v \
            --tb=short --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Database Integrity Tests
        run: |
          cd sft_ingestion
          python -m pytest tests/test_database_integrity.py -v \
            --tb=short --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run API Endpoint Tests
        run: |
          cd sft_ingestion
          python -m pytest tests/test_api_endpoints.py -v \
            --tb=short --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run E2E Pipeline Tests
        run: |
          cd sft_ingestion
          python -m pytest tests/test_e2e_pipeline.py -v \
            --tb=short --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Full Test Suite with Coverage
        run: |
          cd sft_ingestion
          python -m pytest tests/ -v \
            --tb=short \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.10'
        with:
          files: sft_ingestion/coverage.xml
          flags: backend
          name: sft-backend-coverage
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Frontend Build Validation
  # ─────────────────────────────────────────────────────────────
  frontend-build:
    name: 🖥️ Frontend Build (Vite/React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --no-audit

      - name: Build Frontend (Production)
        run: |
          cd frontend
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Security Scan
  # ─────────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Safety & Bandit
        run: pip install safety bandit

      - name: Run Safety (Dependency Vulnerability Check)
        run: |
          cd sft_ingestion
          safety check -r requirements.txt --output text || true

      - name: Run Bandit (Python Security Linter)
        run: |
          cd sft_ingestion
          bandit -r . -x tests/ -ll --format json || true
