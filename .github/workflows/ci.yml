name: Gazi SFT Backend CI/CD

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'sft_ingestion/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sft_ingestion/**'
      - '.github/workflows/ci.yml'

env:
  PYTHON_VERSION: "3.10"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sft_test_db

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Linting & Static Analysis
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: sft_ingestion/requirements.txt

      - name: Install Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright

      - name: Run Ruff Linter
        run: |
          cd sft_ingestion
          ruff check . --output-format=github || true
          # Non-blocking for now — CI proceeds even with lint warnings

      - name: Run Ruff Formatter Check
        run: |
          cd sft_ingestion
          ruff format --check . || true

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Unit + Integration + E2E Tests (PostgreSQL)
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
      fail-fast: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sft_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sft_ingestion/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sft_ingestion/requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov anyio

      - name: Initialize PostgreSQL Schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d sft_test_db \
            -f sft_ingestion/sql/init_schema.sql
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed Test Data
        run: |
          cd sft_ingestion
          python -c "
          import os
          os.environ['DATABASE_URL'] = '${{ env.DATABASE_URL }}'
          # Mock data generator ile 2 hasta seed et
          # CI'da gerçek XML parser çalışır; mock verisini doğrudan DB'ye yaz
          import psycopg2
          conn = psycopg2.connect('${{ env.DATABASE_URL }}')
          cur = conn.cursor()

          # Kaynak belge
          cur.execute('''
            INSERT INTO source_document
              (original_name, file_type, sha256, parser_version, import_status)
            VALUES
              (\'ci_seed_pre.xml\', \'xml\',
               \'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\',
               \'1.0\', \'SUCCESS\'),
              (\'ci_seed_post.xml\', \'xml\',
               \'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\',
               \'1.0\', \'SUCCESS\')
            RETURNING id
          ''')
          doc_ids = [r[0] for r in cur.fetchall()]

          # Hasta
          cur.execute('''
            INSERT INTO patient (source_system, external_id, first_name, last_name, birth_date, ethnic_group)
            VALUES (\'VYAIRE_LOCAL\', \'CI-SEED-001\', \'CI\', \'Seed\', \'2014-01-01\', \'Caucasian\')
            RETURNING id
          ''')
          patient_id = cur.fetchone()[0]

          # Ziyaret (Pre)
          cur.execute('''
            INSERT INTO visit (patient_id, source_doc_id, local_datetime_raw, local_datetime,
              utc_datetime, age, gender, biological_gender, height_m, weight_kg, prediction_module)
            VALUES (%s, %s, \'2026-01-01T08:00:00\', \'2026-01-01 08:00:00\',
              \'2026-01-01 05:00:00+00\', 10, \'Male\', \'Male\', 1.40, 35.0, \'GLI 2012\')
            RETURNING id
          ''', (patient_id, doc_ids[0]))
          visit_id = cur.fetchone()[0]

          # Level Pre
          cur.execute('''
            INSERT INTO measurement_level (visit_id, level_type, sequence_number)
            VALUES (%s, \'Pre\', 1) RETURNING id
          ''', (visit_id,))
          level_id = cur.fetchone()[0]

          # Measurement
          cur.execute('''
            INSERT INTO measurement (level_id, measurement_type, measurement_status)
            VALUES (%s, \'Spirometry\', \'OK\') RETURNING id
          ''', (level_id,))
          meas_id = cur.fetchone()[0]

          # Trial (Best=0)
          cur.execute('''
            INSERT INTO trial (measurement_id, trial_number, status, duration,
              fev1_val, fvc_val, fev1_fvc_ratio, pef_val, fev1_pred_percent, fvc_pred_percent)
            VALUES (%s, 0, \'Valid\', 5.1, 2.10, 2.55, 82.4, 5.20, 88.0, 91.0)
            RETURNING id
          ''', (meas_id,))
          trial_id = cur.fetchone()[0]

          # Curve
          cur.execute('''
            INSERT INTO curve (trial_id, curve_scope, data_type, curve_type, curve_status,
              x_unit, y_unit, x_points, y_points)
            VALUES (%s, \'REPORT\', \'SpirFvc\', \'TYPE_FVC_EX\', \'OK\',
              \'ms\', \'ml\',
              ARRAY[0,100,200,300,400,500,600,700,800,900,1000,1100,1200,1300,1400,1500,1600,1700,1800,1900]::REAL[],
              ARRAY[0,80,280,620,1010,1390,1680,1880,2000,2080,2120,2140,2150,2150,2150,2150,2150,2150,2150,2150]::REAL[])
          ''', (trial_id,))

          # Refresh materialized view
          cur.execute('REFRESH MATERIALIZED VIEW mv_spirometry_best_trial')
          conn.commit()
          cur.close()
          conn.close()
          print('Seed tamamlandi!')
          "

      - name: Create .env File for Tests
        run: |
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > sft_ingestion/.env

      - name: Run Unit Tests (Clinical Logic)
        run: |
          cd sft_ingestion
          python -m pytest tests/test_clinical_logic.py -v \
            --tb=short -m "not integration and not e2e" \
            --cov=. --cov-report=term-missing --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Parser & Idempotency Tests
        run: |
          cd sft_ingestion
          python -m pytest tests/test_parser_idempotency.py -v \
            --tb=short --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Database Integrity Tests
        run: |
          cd sft_ingestion
          python -m pytest tests/test_database_integrity.py -v \
            --tb=short --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run API Endpoint Tests
        run: |
          cd sft_ingestion
          python -m pytest tests/test_api_endpoints.py -v \
            --tb=short --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run E2E Pipeline Tests
        run: |
          cd sft_ingestion
          python -m pytest tests/test_e2e_pipeline.py -v \
            --tb=short --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Full Test Suite with Coverage
        run: |
          cd sft_ingestion
          python -m pytest tests/ -v \
            --tb=short \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --no-header
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.10'
        with:
          files: sft_ingestion/coverage.xml
          flags: backend
          name: sft-backend-coverage
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Frontend Build Validation
  # ─────────────────────────────────────────────────────────────
  frontend-build:
    name: 🖥️ Frontend Build (Vite/React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend (Production)
        run: |
          cd frontend
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Security Scan
  # ─────────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Safety & Bandit
        run: pip install safety bandit

      - name: Run Safety (Dependency Vulnerability Check)
        run: |
          cd sft_ingestion
          safety check -r requirements.txt --output text || true

      - name: Run Bandit (Python Security Linter)
        run: |
          cd sft_ingestion
          bandit -r . -x tests/ -ll --format json || true
