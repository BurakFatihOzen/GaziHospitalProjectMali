[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    unit: Veritabanı gerektirmeyen birim testler
    integration: Canlı veritabanı gerektiren entegrasyon testler
    e2e: Uçtan uca pipeline testleri
    clinical: Klinik ATS/ERS kural doğrulamaları
